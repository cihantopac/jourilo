name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright-core install --with-deps chromium firefox webkit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundled dist and generated docs match sources
        run: npm run check:dist
      - name: Toolchain self-check
        run: node plugin/dist/jourilo.mjs doctor
      - name: Upload failing run reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jourilo-runs-${{ matrix.os }}-${{ matrix.node }}
          path: tests/.tmp/**/report.html
          if-no-files-found: ignore

  package:
    name: clean install from the packed tarball (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Every advertised command from the installed package
        run: node scripts/smoke-pack.mjs

  bench:
    name: detection benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node plugin/dist/jourilo.mjs bench fixtures/sites --workspace .bench

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate . --strict
          claude plugin validate plugin --strict

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: (cd plugin && npm audit --audit-level=moderate)
