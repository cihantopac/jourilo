<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Fixer lab</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-header"><strong>Fixer lab</strong><nav><a href="/">Home</a></nav></header>
<main>
<h1>Sign in</h1>
<form id="login" action="/" method="get">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="show-password" class="ghost">Show password</button>
  <button class="primary" type="submit">Sign in</button>
</form>
</main>
<script>
  // The toggle never cancels the click, and the button has no type: it submits the form as well.
  document.getElementById('show-password').addEventListener('click', function () {
    var pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });
</script>
</body>
</html>
