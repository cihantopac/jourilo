<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dialog with slow focus guards – Widgets lab</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
  <h1>Prompt library</h1>
  <p><a href="/">Back to the lab</a></p>
  <!-- Field case (F30), slow variant: the portal renders two trailing guards in a row (the portal's own and the focus
       manager's, as Floating UI does) and the wrap lags longer than any sensible wait. The Tab walk ends ON a guard
       that is still waiting to wrap, so only the sentinel rule keeps this from being reported as an escape. -->
  <p><button type="button" id="open-dialog" aria-haspopup="dialog">Open details</button></p>
  <div id="portal" hidden>
    <span tabindex="0" aria-hidden="true" data-base-ui-focus-guard style="position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden"></span>
    <div class="overlay"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Prompt details</h2>
      <p><button type="button" id="first">Close</button></p>
    </div></div>
    <span tabindex="0" aria-hidden="true" data-base-ui-focus-guard style="position:fixed;bottom:0;left:0;width:1px;height:1px;overflow:hidden"></span>
    <span tabindex="0" data-floating-ui-focus-guard style="position:fixed;bottom:0;left:2px;width:1px;height:1px;overflow:hidden"></span>
  </div>
</main>
<script>
  var portal = document.getElementById('portal'), opener = document.getElementById('open-dialog');
  var first = document.getElementById('first');
  function close() { portal.hidden = true; opener.focus(); }
  opener.addEventListener('click', function () { portal.hidden = false; first.focus(); });
  first.addEventListener('click', close);
  portal.querySelectorAll('[tabindex="0"]').forEach(function (g) {
    // The wrap lags well past 250 ms.
    g.addEventListener('focus', function () { setTimeout(function () { if (!portal.hidden) first.focus(); }, 400); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !portal.hidden) close(); });
</script>
</body>
</html>
