<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px/1.5 system-ui,sans-serif;color:#111827;margin:0}main{max-width:720px;margin:0 auto;padding:24px 16px}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #1d4ed8}button{font:inherit;padding:10px 16px}</style><title>Broken structure – Structure lab</title></head><body><main>
<h1>Delivery preferences</h1>
<form action="/accessible" method="get">
  <fieldset><p>Delivery speed</p><label><input type="checkbox" name="fast"> Express</label></fieldset>
  <fieldset><legend></legend><label><input type="checkbox" name="gift"> Gift wrap</label></fieldset>
  <p>Leave at the door?</p>
  <label><input type="radio" name="door" value="yes"> Yes</label>
  <label><input type="radio" name="door" value="no"> No</label>
  <p><button type="submit">Save preferences</button></p>
</form>
<h2>Delivery times</h2>
<table><tr><td>Zone</td><td>Days</td></tr><tr><td>City</td><td>1</td></tr><tr><td>Rural</td><td>3</td></tr></table>
<p><img src="/van.svg" alt="" title="Our electric delivery van" width="160" height="80"></p>
</main></body></html>
