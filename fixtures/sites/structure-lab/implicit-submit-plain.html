<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px/1.5 system-ui,sans-serif;color:#111827;margin:0}main{max-width:720px;margin:0 auto;padding:24px 16px}label{display:block;margin-top:12px}input{font:inherit;padding:6px 8px}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #1d4ed8}button{font:inherit;padding:10px 16px;margin-top:12px}</style><title>Sign in, no ids – Structure lab</title></head><body><main>
<h1>Sign in</h1>
<!-- The typeless button has no id and a typed button precedes it: its evidence selector must still point at it. -->
<form id="plain" action="/accessible" method="get">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="reset">Clear</button>
<button>Reveal</button>
<button type="submit">Sign in</button>
</form>
<script>document.querySelector('#plain button:not([type])').addEventListener('click',function(){var p=document.getElementById('password');p.type=p.type==='password'?'text':'password'});</script>
</main></body></html>
