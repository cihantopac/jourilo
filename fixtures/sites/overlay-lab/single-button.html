<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter – Overlay lab</title>
<style>body{font:16px/1.5 system-ui,sans-serif;color:#111827;margin:0}main{max-width:720px;margin:0 auto;padding:24px 16px}button{font:inherit;padding:10px 16px}button:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}</style></head>
<body>
<!-- One focusable element and no script: Tab reaches the button, the next Tab leaves the page, and focus comes back.
     Nothing holds focus, so this is not a trap. -->
<main><h1>Newsletter</h1>
<p>One short letter a month about new features.</p>
<button type="button">Subscribe</button>
</main>
</body>
</html>
