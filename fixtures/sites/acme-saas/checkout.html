<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout – Acme (sandbox)</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main style="max-width:420px;margin:40px auto;padding:0 16px">
  <h1>Checkout</h1>
  <form id="pay" action="/dashboard" method="get">
    <label for="cc">Card number</label>
    <input id="cc" name="cardnumber" autocomplete="cc-number" inputmode="numeric">
    <p><button class="btn" type="submit">Pay $19</button></p>
  </form>
</main>
</body>
</html>
