<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – Acme</title>
<link rel="stylesheet" href="/style.css">
<style>.err { color: #b91c1c; font-size: 14px; } label { display:block; margin-top: 12px; }</style>
</head>
<body>
<header><strong>Acme</strong><nav><a href="/">Home</a> <a href="/signup">Sign up</a></nav></header>
<main style="max-width:420px;margin:40px auto;padding:0 16px">
  <h1>Log in to Acme</h1>
  <form id="login" action="/dashboard" method="get" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <p class="err" id="email-err" hidden></p>
    <label for="password">Password</label>
    <!-- Seeded defect: pasting into the password field is blocked (WCAG 3.3.8 concern). -->
    <input id="password" name="password" type="password" autocomplete="current-password" onpaste="return false">
    <p class="err" id="pw-err" hidden></p>
    <p><button class="btn" type="submit">Log in</button></p>
  </form>
</main>
<script>
  // Seeded defect: errors are shown visually but not tied to the fields or announced.
  document.getElementById('login').addEventListener('submit', function (e) {
    var ok = true;
    var email = document.getElementById('email'), pw = document.getElementById('password');
    var ee = document.getElementById('email-err'), pe = document.getElementById('pw-err');
    ee.hidden = pe.hidden = true;
    if (!email.value) { ee.textContent = 'Email is required'; ee.hidden = false; ok = false; }
    if (!pw.value) { pe.textContent = 'Password is required'; pe.hidden = false; ok = false; }
    if (!ok) e.preventDefault();
  });
</script>
</body>
</html>
