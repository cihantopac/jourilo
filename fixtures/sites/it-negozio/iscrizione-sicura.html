<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iscrizione sicura – Bottega del caffè</title><link rel="stylesheet" href="/stil.css"></head>
<body><main>
  <h1>Crea il tuo account</h1>
  <p>Pagamento sicuro. I tuoi dati sono crittografati.</p>
  <form id="reg" action="/iscrizione" method="post" novalidate>
    <label for="nome">Nome</label><input id="nome" name="nome">
    <label for="cognome">Cognome</label><input id="cognome" name="cognome">
    <label for="email">Indirizzo email</label><input id="email" name="email" type="email">
    <label for="telefono">Cellulare</label><input id="telefono" name="telefono" type="tel" required>
    <label for="password">Password</label><input id="password" name="password" type="password">
    <label for="password2">Password (ripeti)</label><input id="password2" name="password2" type="password">
    <p class="errore" id="reg-errore" hidden></p>
    <p><button class="btn" type="submit">Invia</button></p>
  </form>
</main>
<script>
  // Seeded: errors shown visually, not tied to the field or announced.
  document.getElementById('reg').addEventListener('submit', function (e) {
    if (!document.getElementById('email').value) {
      e.preventDefault();
      var h = document.getElementById('reg-errore'); h.textContent = 'Il campo email è obbligatorio.'; h.hidden = false;
    }
  });
</script>
</body>
</html>
